name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP="$(ls Modexa121-pro*.zip | head -n1)"
          echo "Using: $ZIP"
          mkdir -p proj
          unzip -o -q "$ZIP" -d proj
          DIR="$(dirname "$(find proj -name settings.gradle.kts | head -n1)")"
          echo "Project dir: $DIR"
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk" Modexa-121.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Modexa-121-APK
          path: Modexa-121.apk
          retention-days: 14
